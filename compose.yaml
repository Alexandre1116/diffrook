services:
  oversight:
    build: .
    image: oversight:local
    restart: unless-stopped
    ports:
      - "${OVERSIGHT_BIND_ADDRESS:-127.0.0.1}:${OVERSIGHT_PUBLISHED_PORT:-8080}:8080"
    environment:
      OVERSIGHT_DATA_DIR: /data
      OVERSIGHT_WEB_DIR: /app/web
      OVERSIGHT_HOST: 0.0.0.0
      OVERSIGHT_PORT: 8080
      OVERSIGHT_SECURE_COOKIES: ${OVERSIGHT_SECURE_COOKIES:-}
      OVERSIGHT_PUBLIC_URL: ${OVERSIGHT_PUBLIC_URL:-}
      OVERSIGHT_LOCAL_LOGIN: ${OVERSIGHT_LOCAL_LOGIN:-}
      OVERSIGHT_SESSION_SECONDS: ${OVERSIGHT_SESSION_SECONDS:-28800}
      OVERSIGHT_LICENSE_FILE: ${OVERSIGHT_LICENSE_FILE:-}
      OVERSIGHT_BETA_PLAN: ${OVERSIGHT_BETA_PLAN:-individual}
      OVERSIGHT_TRUSTED_PROXIES: ${OVERSIGHT_TRUSTED_PROXIES:-}
      OVERSIGHT_OIDC_ISSUER_URL: ${OVERSIGHT_OIDC_ISSUER_URL:-}
      OVERSIGHT_OIDC_CLIENT_ID: ${OVERSIGHT_OIDC_CLIENT_ID:-}
      OVERSIGHT_OIDC_CLIENT_SECRET: ${OVERSIGHT_OIDC_CLIENT_SECRET:-}
      OVERSIGHT_OIDC_CLIENT_SECRET_FILE: ${OVERSIGHT_OIDC_CLIENT_SECRET_FILE:-}
      OVERSIGHT_OIDC_ALLOWED_SUBJECTS: ${OVERSIGHT_OIDC_ALLOWED_SUBJECTS:-}
      OVERSIGHT_OIDC_ALLOWED_EMAILS: ${OVERSIGHT_OIDC_ALLOWED_EMAILS:-}
      RUST_LOG: ${RUST_LOG:-oversight=info,tower_http=warn}
    volumes:
      - oversight-data:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    stop_grace_period: 30s

volumes:
  oversight-data:
