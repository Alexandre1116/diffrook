services:
  diffrook:
    build: .
    image: diffrook:local
    restart: unless-stopped
    ports:
      - "${DIFFROOK_BIND_ADDRESS:-127.0.0.1}:${DIFFROOK_PUBLISHED_PORT:-8080}:8080"
    environment:
      DIFFROOK_DATA_DIR: /data
      DIFFROOK_WEB_DIR: /app/web
      DIFFROOK_HOST: 0.0.0.0
      DIFFROOK_PORT: 8080
      DIFFROOK_SECURE_COOKIES: ${DIFFROOK_SECURE_COOKIES:-}
      DIFFROOK_PUBLIC_URL: ${DIFFROOK_PUBLIC_URL:-}
      DIFFROOK_LOCAL_LOGIN: ${DIFFROOK_LOCAL_LOGIN:-}
      DIFFROOK_SESSION_SECONDS: ${DIFFROOK_SESSION_SECONDS:-28800}
      DIFFROOK_TRUSTED_PROXIES: ${DIFFROOK_TRUSTED_PROXIES:-}
      DIFFROOK_OIDC_ISSUER_URL: ${DIFFROOK_OIDC_ISSUER_URL:-}
      DIFFROOK_OIDC_CLIENT_ID: ${DIFFROOK_OIDC_CLIENT_ID:-}
      DIFFROOK_OIDC_CLIENT_SECRET: ${DIFFROOK_OIDC_CLIENT_SECRET:-}
      DIFFROOK_OIDC_CLIENT_SECRET_FILE: ${DIFFROOK_OIDC_CLIENT_SECRET_FILE:-}
      DIFFROOK_OIDC_ALLOWED_SUBJECTS: ${DIFFROOK_OIDC_ALLOWED_SUBJECTS:-}
      DIFFROOK_OIDC_ALLOWED_EMAILS: ${DIFFROOK_OIDC_ALLOWED_EMAILS:-}
      RUST_LOG: ${RUST_LOG:-diffrook=info,tower_http=warn}
    volumes:
      - diffrook-data:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    stop_grace_period: 30s

volumes:
  diffrook-data:
