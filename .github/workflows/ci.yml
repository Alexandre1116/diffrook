name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing tag and draft release to package and validate
        required: true
        type: string
permissions:
  contents: read
jobs:
  checks:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web
      - run: node --test scripts/license.test.mjs
      - run: rustup component add rustfmt clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - name: Dependency security audit
        run: |
          cargo install cargo-audit --locked
          # OIDC verifies public signatures only. No RSA private-key operations.
          # Review this scoped exception if cryptographic usage changes.
          # See docs/sso-and-internet.md for RUSTSEC-2023-0071 and its scope.
          cargo audit --ignore RUSTSEC-2023-0071
      - run: docker build -t oversight:test .
      - name: Container integration smoke test
        run: |
          docker run -d --name oversight-smoke -p 127.0.0.1:18080:8080 \
            --add-host host.docker.internal:host-gateway \
            -e OVERSIGHT_SETUP_TOKEN=smoke-setup-token oversight:test
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:18080/healthz; then break; fi
            sleep 1
          done
          node scripts/smoke.mjs
        env:
          OVERSIGHT_TEST_URL: http://127.0.0.1:18080
          OVERSIGHT_TEST_SETUP_TOKEN: smoke-setup-token
      - name: Clean up smoke container
        if: always()
        run: docker rm -f -v oversight-smoke || true

  release-package:
    if: github.event_name == 'workflow_dispatch'
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    env:
      RELEASE_TAG: ${{ inputs.release_tag || github.event.release.tag_name }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.event.release.tag_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci && npm run build
        working-directory: web
      - run: |
          version=$(awk -F '"' '/^version = / { print $2; exit }' Cargo.toml)
          test "v$version" = "$RELEASE_TAG"
      - run: docker build --target server -t oversight-release-builder:latest .
      - run: |
          mkdir -p bundle/web
          cid=$(docker create oversight-release-builder:latest)
          docker cp "$cid:/oversight" bundle/oversight
          docker rm "$cid"
          cp -R web/dist/. bundle/web/
          # Keep notices under web/ so pre-0.2 update extractors accept the package.
          mkdir -p bundle/web/licenses
          cp LICENSE bundle/web/licenses/LICENSE
          cp -R docs/licenses/. bundle/web/licenses/
          tar -czf "oversight-linux-${{ matrix.arch }}.tar.gz" -C bundle oversight web
      - name: Test the packaged binary and backup restoration
        run: bash scripts/release-smoke.sh "oversight-linux-${{ matrix.arch }}.tar.gz"
      - name: Upload validated packages
        run: |
          archive="oversight-linux-${{ matrix.arch }}.tar.gz"
          sha256sum "$archive" > "$archive.sha256"
          gh release upload "$RELEASE_TAG" "$archive" "$archive.sha256" --repo "$GITHUB_REPOSITORY" --clobber
        env:
          GH_TOKEN: ${{ github.token }}
