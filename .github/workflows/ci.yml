name: CI
on:
  push:
  pull_request:
  release:
    types: [published]
permissions:
  contents: read
jobs:
  checks:
    if: github.event_name != 'release'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web
      - run: node --test scripts/license.test.mjs
      - run: rustup component add rustfmt clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - name: Dependency security audit
        run: |
          cargo install cargo-audit --locked
          # OIDC verifies public signatures only. No RSA private-key operations.
          # Review this scoped exception if cryptographic usage changes.
          # See docs/sso-and-internet.md for RUSTSEC-2023-0071 and its scope.
          cargo audit --ignore RUSTSEC-2023-0071
      - run: docker build -t diffrook:test .
      - name: Container integration smoke test
        run: |
          docker run -d --name diffrook-smoke -p 127.0.0.1:18080:8080 \
            --add-host host.docker.internal:host-gateway \
            -e DIFFROOK_SETUP_TOKEN=smoke-setup-token diffrook:test
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:18080/healthz; then break; fi
            sleep 1
          done
          node scripts/smoke.mjs
        env:
          DIFFROOK_TEST_URL: http://127.0.0.1:18080
          DIFFROOK_TEST_SETUP_TOKEN: smoke-setup-token
      - name: Clean up smoke container
        if: always()
        run: docker rm -f -v diffrook-smoke || true

  release-package:
    if: github.event_name == 'release' && github.event.action == 'published'
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci && npm run build
        working-directory: web
      - run: |
          version=$(awk -F '"' '/^version = / { print $2; exit }' Cargo.toml)
          test "v$version" = "$GITHUB_REF_NAME"
      - run: docker build --target server -t diffrook-release-builder:latest .
      - run: |
          mkdir -p bundle/web
          cid=$(docker create diffrook-release-builder:latest)
          docker cp "$cid:/diffrook" bundle/diffrook
          docker rm "$cid"
          cp -R web/dist/. bundle/web/
          cp LICENSE bundle/LICENSE
          mkdir -p bundle/licenses
          cp docs/licenses/CC-BY-NC-4.0.txt bundle/licenses/
          tar -czf "diffrook-linux-${{ matrix.arch }}.tar.gz" -C bundle diffrook web LICENSE licenses
          gh release upload "$GITHUB_REF_NAME" "diffrook-linux-${{ matrix.arch }}.tar.gz" --repo "$GITHUB_REPOSITORY" --clobber
        env:
          GH_TOKEN: ${{ github.token }}
