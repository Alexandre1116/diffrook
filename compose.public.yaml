# Optional overlay: docker compose -f compose.yaml -f compose.public.yaml up --build -d
# Every installation supplies its own OVERSIGHT_DOMAIN and OIDC configuration.
services:
  oversight:
    environment:
      OVERSIGHT_PUBLIC_URL: https://${OVERSIGHT_DOMAIN:?Set the company installation domain}
      OVERSIGHT_SECURE_COOKIES: "true"
      OVERSIGHT_TRUSTED_PROXIES: 172.30.99.2
    networks:
      edge:
        ipv4_address: 172.30.99.3

  proxy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      OVERSIGHT_DOMAIN: ${OVERSIGHT_DOMAIN:?Set the company installation domain}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      edge:
        ipv4_address: 172.30.99.2
    depends_on:
      oversight:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true

networks:
  edge:
    ipam:
      config:
        - subnet: 172.30.99.0/24

volumes:
  caddy-data:
  caddy-config:
